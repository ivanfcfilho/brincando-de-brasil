<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITULO}}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-dark: #07090e;
        --bg-surface: #10141d;
        --bg-card: #181d29;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --text-citation: #64748b;
        --accent-gold: #c6a85c;
        --accent-gold-dim: rgba(198, 168, 92, 0.1);
        --border-color: #273142;
        --danger: #f85149;
        --success: #2ea043;
        --warning: #d29922;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      h4,
      .serif {
        font-family: "Merriweather", serif;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* Header */
      header {
        padding: 100px 0 70px;
        text-align: center;
        border-bottom: 1px solid var(--border-color);
        background: radial-gradient(
          circle at top,
          var(--bg-surface) 0%,
          var(--bg-dark) 100%
        );
      }

      .tag {
        display: inline-block;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 2px;
        color: var(--accent-gold);
        margin-bottom: 24px;
        border: 1px solid var(--accent-gold);
        padding: 6px 16px;
        border-radius: 50px;
      }
      .hero-title {
        font-size: 3.2rem;
        line-height: 1.2;
        margin-bottom: 24px;
        color: #fff;
        font-weight: 900;
      }
      .hero-subtitle {
        font-size: 1.15rem;
        color: var(--text-muted);
        max-width: 800px;
        margin: 0 auto;
      }

      /* Sections */
      section {
        padding: 90px 0;
        border-bottom: 1px solid var(--border-color);
      }
      .section-title {
        font-size: 2.2rem;
        margin-bottom: 16px;
        color: #fff;
        text-align: center;
      }
      .section-title span {
        color: var(--accent-gold);
      }
      .section-desc {
        text-align: center;
        color: var(--text-muted);
        max-width: 800px;
        margin: 0 auto 50px;
        font-size: 1.1rem;
      }

      /* Grid */
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 32px;
        align-items: start;
      }
      @media (max-width: 768px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .hero-title {
          font-size: 2.2rem;
        }
      }

      /* FOLDING STYLES (Cards and Patches) */
      .card,
      .patch-card {
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border-color);
        transition: border-color 0.3s ease;
      }
      .card {
        padding: 35px;
      }
      .card:hover {
        border-color: var(--accent-gold);
      }

      .card-icon {
        font-size: 2rem;
        color: var(--accent-gold);
        margin-bottom: 15px;
        font-weight: 900;
      }
      .card h3 {
        font-size: 1.4rem;
        margin-bottom: 12px;
        color: #fff;
      }
      .summary-text {
        color: var(--text-muted);
        margin-bottom: 20px;
        font-size: 1.05rem;
      }

      details {
        margin-top: 15px;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      summary {
        padding: 16px 20px;
        cursor: pointer;
        font-weight: 600;
        color: var(--accent-gold);
        background: rgba(0, 0, 0, 0.3);
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: background 0.2s;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary:hover {
        background: rgba(0, 0, 0, 0.6);
      }
      summary::after {
        content: "+";
        font-size: 1.5rem;
        font-weight: 300;
        transition: transform 0.3s;
      }
      details[open] summary::after {
        transform: rotate(45deg);
      }

      .fold-content {
        padding: 25px;
        border-top: 1px solid var(--border-color);
      }

      /* Scientific Content Formatting */
      .academic-p {
        font-size: 0.95rem;
        color: #cbd5e1;
        margin-bottom: 16px;
        text-align: justify;
      }

      .citation-box {
        background: #090b10;
        border-left: 3px solid var(--accent-gold);
        padding: 15px 20px;
        margin: 20px 0;
        border-radius: 0 6px 6px 0;
      }
      .citation-box h5 {
        color: var(--accent-gold);
        font-family: "Inter", sans-serif;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .citation-box ul {
        list-style-type: none;
      }
      .citation-box li {
        color: var(--text-citation);
        font-size: 0.85rem;
        margin-bottom: 8px;
        padding-left: 15px;
        position: relative;
      }
      .citation-box li::before {
        content: "•";
        position: absolute;
        left: 0;
        color: var(--accent-gold);
      }

      /* Patches Grid Specifics */
      .patch-card {
        padding: 0;
        overflow: hidden;
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: 1fr 2fr;
      }
      .patch-problem {
        background: rgba(248, 81, 73, 0.05);
        padding: 30px;
        border-right: 1px solid var(--border-color);
      }
      .patch-problem h4 {
        color: var(--danger);
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 1px;
        margin-bottom: 10px;
        font-family: "Inter", sans-serif;
      }
      .patch-problem p {
        color: #fff;
        font-size: 1.05rem;
      }

      .patch-solution {
        padding: 30px;
        background: var(--bg-card);
      }
      .patch-solution h4 {
        color: var(--success);
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }
      .patch-solution h3 {
        color: var(--accent-gold);
        margin-bottom: 12px;
        font-size: 1.3rem;
      }
      .patch-solution > p {
        color: var(--text-muted);
        font-size: 1rem;
        margin-bottom: 15px;
      }

      .math-block {
        background: #000;
        padding: 15px;
        border-radius: 6px;
        font-family: monospace;
        color: var(--warning);
        margin: 15px 0;
        border: 1px solid var(--border-color);
        font-size: 0.9rem;
        text-align: center;
      }

      @media (max-width: 900px) {
        .patch-card {
          grid-template-columns: 1fr;
        }
        .patch-problem {
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }
      }

      footer {
        text-align: center;
        padding: 50px 0;
        color: var(--text-muted);
        font-size: 0.9rem;
      }
    </style>
  </head>

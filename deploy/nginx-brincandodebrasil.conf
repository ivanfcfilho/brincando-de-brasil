# Bloco a INSERIR dentro do server{} que já existe em
# /etc/nginx/sites-enabled/studiocantare.com — antes do `location / {`.
#
# A barra final no proxy_pass é obrigatória: é ela que faz o nginx REMOVER
# o prefixo antes de repassar. A aplicação continua respondendo em /escola.html
# e /api/…, e quem cuida do prefixo nos links é o próprio app (--prefixo),
# que reescreve o HTML na saída.
#
# Sem a barra, o app receberia /brincandodebrasil/escola.html e devolveria 404.

    location /brincandodebrasil/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Sem esta linha, /brincandodebrasil (sem barra) cairia no `location /`
    # do Django e devolveria 404.
    location = /brincandodebrasil {
        return 301 /brincandodebrasil/;
    }
